<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chouette Patrimoine{% endblock %} — Pilotage Conciergerie</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" aria-label="Navigation principale">
    <div class="sidebar-brand">
      <img src="/static/img/logo-main.png" alt="Logo Chouette Patrimoine" class="sidebar-logo">
      <div class="sidebar-brand-text">
        <span class="brand-top">Chouette</span>
        <span class="brand-bottom">Patrimoine</span>
      </div>
    </div>

    <nav class="sidebar-nav">

      <!-- 1. Accueil — DISPONIBLE APP-0 -->
      <a href="/" class="nav-item {% if active_menu == 'accueil' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9L12 2l9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-label">Accueil</span>
      </a>

      <!-- 2. Logements — DISPONIBLE APP-1 -->
      <a href="/logements" class="nav-item {% if active_menu == 'logements' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
        </svg>
        <span class="nav-label">Logements</span>
      </a>

      <!-- 3. Propriétaires & règlements — DISPONIBLE APP-3c -->
      <a href="/proprietaires" class="nav-item {% if active_menu == 'proprietaires' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">Propriétaires &amp; règlements</span>
      </a>

      <!-- 4. Réservations — DISPONIBLE APP-2a (lecture seule) -->
      <a href="/reservations" class="nav-item {% if active_menu == 'reservations' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-label">Réservations</span>
      </a>

      <!-- 5. Fournisseurs — DISPONIBLE APP-3a -->
      <a href="/fournisseurs" class="nav-item {% if active_menu == 'fournisseurs' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="nav-label">Fournisseurs</span>
      </a>

      <!-- 6. Banques & caisse — À VENIR (APP-4) -->
      <span class="nav-item nav-item--future" title="Disponible à partir du Lot APP-4">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <span class="nav-label">Banques &amp; caisse</span>
        <span class="nav-badge-future">APP-4</span>
      </span>

      <!-- 7. Ménages — DISPONIBLE APP-2 -->
      <a href="/menages" class="nav-item {% if active_menu == 'menages' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/>
        </svg>
        <span class="nav-label">Ménages</span>
      </a>

      <!-- 8. Sources & calculs — DISPONIBLE APP-0 -->
      <a href="/sources-calculs" class="nav-item {% if active_menu == 'sources_calculs' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="nav-label">Sources &amp; calculs</span>
      </a>

      <!-- 9. Contrôles & clôture — À VENIR (APP-5) -->
      <span class="nav-item nav-item--future" title="Disponible à partir du Lot APP-5">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <span class="nav-label">Contrôles &amp; clôture</span>
        <span class="nav-badge-future">APP-5</span>
      </span>

    </nav>
  </aside>

  <!-- ===== ZONE PRINCIPALE ===== -->
  <div class="main-area">

    <!-- Header -->
    <header class="app-header">
      <div class="header-actions">
        <button class="icon-btn" title="Santé du système" onclick="window.location='/health'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Contenu page -->
    <main class="page-content">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>
</body>
</html>
